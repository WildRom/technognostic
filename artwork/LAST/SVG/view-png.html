<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PNG Viewer</title>
  <style>
    :root{--gap:12px}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; margin:20px}
    h1{font-size:18px;margin:0 0 12px}
    .controls{display:flex;gap:12px;align-items:center;margin-bottom:12px}
    .swatches{display:flex;gap:8px;flex-wrap:wrap}
    .swatch{width:64px;height:64px;border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600}
    .swatch.border{border:1px solid #ddd;color:#000}
    .preview-wrap{width:100%;max-width:900px;height:600px;border:1px solid #ccc;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:auto}
    .preview{width:auto;max-width:100%;height:auto;max-height:100%;}
    .hint{color:#666;font-size:13px}
    .left{display:flex;flex-direction:column;gap:8px}
    .file-drop{width:220px;padding:12px;border:2px dashed #ccc;border-radius:8px;text-align:center}
    .file-drop.drag{border-color:#0078d4;background:#f0f8ff}
  </style>
</head>
<body>
  <h1>PNG peržiūros įrankis</h1>
  <div class="controls">
    <div class="left">
      <label class="file-drop" id="drop">Velkite PNG čia arba
        <input id="file" type="file" accept="image/png" style="display:none">
        <div class="hint">spustelėkite arba numeskite</div>
      </label>
      <div class="hint">Pasirinkite fono spalvą:</div>
      <div class="swatches" id="swatches">
        <div class="swatch" data-color="#000" style="background:#000">Juoda</div>
        <div class="swatch border" data-color="#fff" style="background:#fff;color:#000">Balta</div>
        <div class="swatch" data-color="#ff3b30" style="background:#ff3b30">Raudona</div>
        <div class="swatch" data-color="#34c759" style="background:#34c759">Žalia</div>
        <div class="swatch" data-color="#007aff" style="background:#007aff">Mėlyna</div>
        <div class="swatch" data-color="#ffcc00" style="background:#ffcc00;color:#000">Geltona</div>
      </div>
    </div>
    <div style="flex:1"></div>
  </div>

  <div class="preview-wrap" id="previewWrap" style="background:#000">
    <img id="img" class="preview" alt="PNG preview" />
  </div>

  <script>
    const fileInput = document.getElementById('file');
    const drop = document.getElementById('drop');
    const img = document.getElementById('img');
    const swatches = document.getElementById('swatches');
    const previewWrap = document.getElementById('previewWrap');

    drop.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => handleFiles(e.target.files));

    // Drag & drop
    ['dragenter','dragover'].forEach(ev => {
      drop.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); drop.classList.add('drag'); });
    });
    ['dragleave','drop'].forEach(ev => {
      drop.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); drop.classList.remove('drag'); });
    });
    drop.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

    function handleFiles(files){
      if(!files || files.length===0) return;
      const f = files[0];
      if(!f.type.includes('png')) { alert('Prašome pasirinkti PNG failą.'); return; }
      const url = URL.createObjectURL(f);
      img.src = url;
    }

    swatches.addEventListener('click', e => {
      const sw = e.target.closest('.swatch');
      if(!sw) return;
      const c = sw.dataset.color || '#000';
      previewWrap.style.background = c;
    });
  </script>
</body>
</html>
